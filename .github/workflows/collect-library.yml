name: Collect research library

on:
  schedule:
    - cron: "20 21 * * *" # 매일 한국 시간 06:20
  workflow_dispatch:
    inputs:
      since:
        description: "이 날짜(YYYY-MM-DD) 이후 출판분을 수집. 비우면 최근 90일"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-library
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect
        env:
          KCI_API_KEY: ${{ secrets.KCI_API_KEY }}
          SINCE: ${{ inputs.since }}
        run: node scripts/collect-library.mjs ${SINCE:+--since "$SINCE"}

      # 새 논문이 있을 때만 커밋하고 배포를 다시 돌린다(GITHUB_TOKEN 으로 한 push 는 배포 워크플로를 깨우지 않는다)
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet app/data/library.json && { echo "no change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/library.json
          git commit -m "Update research library"
          git push
          gh workflow run deploy-pages.yml --ref main
